name: Canon Gate Resolver

on:
  push:
    branches:
      - main
    paths:
      - "canon_gate/**"
      - "tests/test_canon_gate_truth_table.py"
      - "requirements.txt"
      - ".github/workflows/canon-gate.yml"
  pull_request:
    paths:
      - "canon_gate/**"
      - "tests/test_canon_gate_truth_table.py"
      - "requirements.txt"
      - ".github/workflows/canon-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-table:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Canon Gate package
        run: python -m compileall -q canon_gate tests/test_canon_gate_truth_table.py

      - name: Run Canon Gate truth table
        run: pytest tests/test_canon_gate_truth_table.py -v
