name: UDS v1.1 Authority Reference

on:
  pull_request:
    paths:
      - 'Genesis/uds_v1_1/**'
      - 'tests/test_uds_v1_1_authority.py'
      - 'tests/conformance/test_council_constitution.py'
      - 'policies/uds_v1_1_invariants.json'
      - 'schemas/uds-v1.1/**'
      - 'docs/uds/v1.1/**'
      - 'docs/architecture/Council-Constitution-v1.0.md'
      - 'docs/architecture/council-rosetta-crosswalk-v1.0.md'
      - 'spec/council-constitution-v1.0.json'
      - '.github/workflows/uds-v1-1-authority.yml'
  push:
    branches: [main]
    paths:
      - 'Genesis/uds_v1_1/**'
      - 'tests/test_uds_v1_1_authority.py'
      - 'tests/conformance/test_council_constitution.py'
      - 'policies/uds_v1_1_invariants.json'
      - 'schemas/uds-v1.1/**'
      - 'docs/uds/v1.1/**'
      - 'docs/architecture/Council-Constitution-v1.0.md'
      - 'docs/architecture/council-rosetta-crosswalk-v1.0.md'
      - 'spec/council-constitution-v1.0.json'

permissions:
  contents: read

jobs:
  authority-reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run UDS v1.1 authority and Council conformance tests
        run: >-
          python -m unittest tests.test_uds_v1_1_authority
          tests.conformance.test_council_constitution -v
