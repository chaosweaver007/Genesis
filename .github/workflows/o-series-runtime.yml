name: Genesis O-Series Runtime

on:
  push:
    branches:
      - main
    paths:
      - "Genesis/o_series/**"
      - "Genesis/o_series_app.py"
      - "personas/**"
      - "policies/**"
      - "standards/uds/candidates/**"
      - "docs/architecture/Genesis-Kernel-v0.1-Source-Map.md"
      - "docs/architecture/rosetta-crosswalk-v1.0.md"
      - "docs/architecture/rosetta-witness-ledger-v1.0.md"
      - "spec/rosetta-crosswalk-v1.0.json"
      - "tests/conformance/test_uds_crosswalk.py"
      - "tests/test_o_series_runtime.py"
      - "tests/test_genesis_consolidation.py"
      - "tests/test_sonic_codex_recognizer.py"
      - "tests/test_selector_correction.py"
      - "tests/test_sovereign_refusal_boundary.py"
      - "tests/test_sovereign_refusal_delegation.py"
      - "wsgi.py"
      - "requirements.txt"
      - ".github/workflows/o-series-runtime.yml"
  pull_request:
    paths:
      - "Genesis/o_series/**"
      - "Genesis/o_series_app.py"
      - "personas/**"
      - "policies/**"
      - "standards/uds/candidates/**"
      - "docs/architecture/Genesis-Kernel-v0.1-Source-Map.md"
      - "docs/architecture/rosetta-crosswalk-v1.0.md"
      - "docs/architecture/rosetta-witness-ledger-v1.0.md"
      - "spec/rosetta-crosswalk-v1.0.json"
      - "tests/conformance/test_uds_crosswalk.py"
      - "tests/test_o_series_runtime.py"
      - "tests/test_genesis_consolidation.py"
      - "tests/test_sonic_codex_recognizer.py"
      - "tests/test_selector_correction.py"
      - "tests/test_sovereign_refusal_boundary.py"
      - "tests/test_sovereign_refusal_delegation.py"
      - "wsgi.py"
      - "requirements.txt"
      - ".github/workflows/o-series-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile secured runtime
        run: >-
          python -m compileall -q Genesis/o_series Genesis/o_series_app.py wsgi.py
          tests/conformance/test_uds_crosswalk.py tests/test_o_series_runtime.py
          tests/test_genesis_consolidation.py tests/test_sonic_codex_recognizer.py
          tests/test_selector_correction.py tests/test_sovereign_refusal_boundary.py
          tests/test_sovereign_refusal_delegation.py

      - name: Run O-Series runtime tests
        run: >-
          python -m unittest tests.conformance.test_uds_crosswalk
          tests.test_o_series_runtime tests.test_genesis_consolidation
          tests.test_sonic_codex_recognizer tests.test_selector_correction
          tests.test_sovereign_refusal_boundary tests.test_sovereign_refusal_delegation -v

      - name: Verify WSGI entrypoint
        run: python -c "import wsgi; assert wsgi.app is not None"
