name: UDS Receiver Reference Enforcement

on:
  pull_request:
    paths:
      - 'Genesis/auth/**'
      - 'Genesis/uds_v1_1/**'
      - 'tests/test_authorization_enforcer.py'
      - 'tests/test_uds_v1_1_authority.py'
      - '.github/workflows/uds-receiver-enforcer.yml'
  push:
    branches: [main]
    paths:
      - 'Genesis/auth/**'
      - 'Genesis/uds_v1_1/**'
      - 'tests/test_authorization_enforcer.py'
      - 'tests/test_uds_v1_1_authority.py'

permissions:
  contents: read

jobs:
  reference-enforcer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run authorization reference conformance tests
        run: |
          python -m unittest tests.test_uds_v1_1_authority tests.test_authorization_enforcer -v
